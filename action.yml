name: 'Azure Web App Deploy'
description: 'Deploy to Azure Web Apps'
inputs:
  azure_client_id:
    description: 'Azure client id'
    required: true
  azure_client_secret:
    description: 'Azure client secret'
    required: false
  azure_subscription_id:
    description: 'Azure subscription id'
    required: true
  azure_tenant_id:
    description: 'Azure tenant id'
    required: true
  azure_webapp_name:
    description: 'Azure webapp name'
    required: true
  resource_group:
    description: 'Resource group'
    required: true
  deployment_slot:
    description: 'Deployment slot'
    required: true
  image:
    description: 'Image'
    required: false
  package:
    description: 'Package'
    required: false
  ad_app_id:
    description: 'Azure AD app id'
    required: false
  env_vars:
    description: 'Environment Variables'
    required: false
  enable_managed_identity:
    description: 'If true, assign a system managed identity to the webapp and apply roles provided in managed_identity_roles (true/false)'
    required: false
    default: 'false'
  managed_identity_roles:
    description: |
      'JSON array of role assignments. Each entry must be an object with "role" and "scope" fields.
      Example: [{"role":"AcrPull","scope":"/subscriptions/.../resourceGroups/rg/providers/Microsoft.ContainerRegistry/registries/registryname"}]'
    required: false

runs:
  using: "composite"
  steps:  
      - name: Azure login
        if: inputs.azure_client_secret != ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          creds: |
            {
              "clientId": "${{ inputs.azure_client_id }}",
              "clientSecret": "${{ inputs.azure_client_secret }}",
              "subscriptionId": "${{ inputs.azure_subscription_id }}",
              "tenantId": "${{ inputs.azure_tenant_id }}",
              "resourceManagerEndpointUrl": "https://management.azure.com/"
            }
      - name: Azure login (OIDC)
        if: inputs.azure_client_secret == ''
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Clean names
        shell: bash
        id: names
        run: |
          slot_name=$(echo "${INPUTS_DEPLOYMENT_SLOT}" | sed 's/[^A-Za-z0-9-]/-/g')
          echo "slot_name=$slot_name" >> $GITHUB_OUTPUT
          
          if [ -n "$slot_name" ]; then
            echo "slot_args=--slot $slot_name" >> $GITHUB_OUTPUT
          fi
        env:
          INPUTS_DEPLOYMENT_SLOT: ${{ inputs.deployment_slot }}
          
      - name: Create a new web app slot if it doesn't exist
        shell: bash
        if: steps.names.outputs.slot_name != ''
        run: |
          exists=$(az webapp deployment slot list --name ${INPUTS_AZURE_WEBAPP_NAME} \
            --resource-group ${INPUTS_RESOURCE_GROUP} --query "[?name=='${SLOT_NAME}'].name" -o tsv)
        
          if [ -z "$exists" ]; then
              echo "Slot does not exist"
              az webapp deployment slot create --name ${INPUTS_AZURE_WEBAPP_NAME} \
                --resource-group ${INPUTS_RESOURCE_GROUP} --slot ${SLOT_NAME} --configuration-source ${INPUTS_AZURE_WEBAPP_NAME}
          else
              echo "Slot already exists"
          fi
        env:
          INPUTS_AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          INPUTS_RESOURCE_GROUP: ${{ inputs.resource_group }}
          SLOT_NAME: ${{ steps.names.outputs.slot_name }}

      - name: Add Managed Identity
        id: identity
        if: inputs.enable_managed_identity == 'true'
        shell: bash
        run: |
          az webapp identity assign --name ${INPUTS_AZURE_WEBAPP_NAME} ${STEPS_NAMES_OUTPUTS_SLOT_ARGS} \
            --resource-group ${INPUTS_RESOURCE_GROUP}
          
          principal_id=$(az webapp identity show --name ${INPUTS_AZURE_WEBAPP_NAME} ${STEPS_NAMES_OUTPUTS_SLOT_ARGS} \
            --resource-group ${INPUTS_RESOURCE_GROUP} --query principalId -o tsv)

          if [ -z "$principal_id" ]; then
            echo "ERROR: could not determine principalId for webapp" >&2
            exit 1
          fi
          
          echo "PrincipalId: $principal_id"
          echo "principal_id=$principal_id" >> $GITHUB_OUTPUT
        env:
          INPUTS_AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          STEPS_NAMES_OUTPUTS_SLOT_ARGS: ${{ steps.names.outputs.slot_args }}
          INPUTS_RESOURCE_GROUP: ${{ inputs.resource_group }}

      - name: Assign roles
        if: ${{ inputs.enable_managed_identity == 'true' && inputs.managed_identity_roles != '' && steps.identity.outputs.principal_id != '' }}
        shell: bash
        env:
          ROLES_JSON: '${{ inputs.managed_identity_roles }}'
          TIMEOUT: 300
          INTERVAL: 10
          PRINCIPAL_ID: ${{ steps.identity.outputs.principal_id }}
          INPUTS_AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          STEPS_NAMES_OUTPUTS_SLOT_ARGS: ${{ steps.names.outputs.slot_args }}
          INPUTS_RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          max_attempts=$((TIMEOUT / INTERVAL))

          while read -r entry; do
            role=$(echo "$entry" | jq -r '.role')
            scope=$(echo "$entry" | jq -r '.scope')
            if [ -z "$role" ] || [ -z "$scope" ] || [ "$role" = "null" ] || [ "$scope" = "null" ]; then
              echo "Skipping invalid entry: $entry"
              continue
            fi

            echo "Assigning role '$role' on scope '$scope' to principal $PRINCIPAL_ID"

            for ((i=1;i<=max_attempts;i++)); do
              if az role assignment create --assignee "$PRINCIPAL_ID" --role "$role" --scope "$scope" 2>/dev/null; then
                echo "Assigned role: $role"
                break
              fi
              if [ $i -eq $max_attempts ]; then
                echo "ERROR: Failed to assign $role within ${TIMEOUT}s" >&2
                exit 1
              fi
              echo "Retrying role assignment ($i/$max_attempts)..."
              sleep $INTERVAL
            done
          
            if [ "$role" = "AcrPull" ]; then 
              # AcrPull role requires webapp config update to use the managed identity creds, so do that immediately after assignment
              az webapp config set --name ${INPUTS_AZURE_WEBAPP_NAME} ${STEPS_NAMES_OUTPUTS_SLOT_ARGS} \
                --resource-group ${INPUTS_RESOURCE_GROUP} --generic-configurations '{"acrUseManagedIdentityCreds": true}'
            fi
          done < <(echo "$ROLES_JSON" | jq -c '.[]')

      - name: Get publish profile
        shell: bash
        id: profile
        run: |
          publish_profile=$(az webapp deployment list-publishing-profiles --name ${INPUTS_AZURE_WEBAPP_NAME} \
              --resource-group ${INPUTS_RESOURCE_GROUP} ${STEPS_NAMES_OUTPUTS_SLOT_ARGS}  --xml) 
          
          app_url=$(echo $publish_profile | sed -nr 's/.*destinationAppUrl="([^"]+).*/\1/p')
          echo "publish_profile=${publish_profile}" >> $GITHUB_OUTPUT
          echo "url=${app_url/http:/https:}" >> $GITHUB_OUTPUT
        env:
          INPUTS_AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          INPUTS_RESOURCE_GROUP: ${{ inputs.resource_group }}
          STEPS_NAMES_OUTPUTS_SLOT_ARGS: ${{ steps.names.outputs.slot_args }}

      - name: Update AD
        if:  "${{ inputs.ad_app_id != '' }}"
        shell: bash
        run: |
          uri="${STEPS_PROFILE_OUTPUTS_URL}/signin-oidc"          
          redirectUris=$(az ad app show --id ${INPUTS_AD_APP_ID} | jq -c '.web.redirectUris + ["'$uri'"] | unique |  {"web": {"redirectUris": . }}')
          az rest --method PATCH --uri 'https://graph.microsoft.com/v1.0/applications/${INPUTS_AD_APP_ID}' --headers 'Content-Type=application/json' --body "$redirectUris"
        env:
          STEPS_PROFILE_OUTPUTS_URL: ${{ steps.profile.outputs.url }}
          INPUTS_AD_APP_ID: ${{ inputs.ad_app_id }}
      
      - name: Run Azure webapp deploy action using publish profile credentials
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ inputs.azure_webapp_name }}
          publish-profile: ${{ inputs.azure_webapp_publish_profile }}
          slot-name: ${{ steps.names.outputs.slot_name }}
          package: ${{ inputs.package }}
          images: ${{ inputs.image }}
          resource-group-name: ${{ inputs.resource_group }}

      - name: Add Environment Variables
        shell: bash
        if: "${{ inputs.env_vars != '' }}"
        run: |
          az webapp config appsettings set --name "${INPUTS_AZURE_WEBAPP_NAME}" ${STEPS_NAMES_OUTPUTS_SLOT_ARGS} \
            --resource-group "${INPUTS_RESOURCE_GROUP}" --settings ${INPUTS_ENV_VARS}
        env:
          INPUTS_AZURE_WEBAPP_NAME: ${{ inputs.azure_webapp_name }}
          STEPS_NAMES_OUTPUTS_SLOT_ARGS: ${{ steps.names.outputs.slot_args }}
          INPUTS_RESOURCE_GROUP: ${{ inputs.resource_group }}
          INPUTS_ENV_VARS: ${{ inputs.env_vars }}

      - name: Add Success Message
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_URL: ${{ steps.profile.outputs.url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Your PR has been deployed to [${process.env.APP_URL}](${process.env.APP_URL})`
            })
